<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>New Tab</title>
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>

    <!-- Displacement map for the liquid-glass refraction. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.007 0.011" numOctaves="2" seed="11" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="map" />
        <feDisplacementMap in="SourceGraphic" in2="map" scale="40" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <div class="top-bar">
      <div id="animal-choices" class="choices glass" role="radiogroup" aria-label="Animal"></div>
      <button class="animal-dock-toggle" type="button" aria-expanded="true" aria-controls="animal-choices" aria-label="Hide animal controls" title="Hide animal controls">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>

    <main class="stage">
      <form class="composer glass" autocomplete="off">
        <div class="composer-field">
          <svg class="composer-search" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m15.5 15.5 5 5" />
          </svg>
          <textarea name="prompt" rows="1" placeholder="Search the web..." aria-label="Search the web"></textarea>
        </div>
      </form>
    </main>

    <script type="module" src="/demo.ts"></script>
  </body>
</html>
